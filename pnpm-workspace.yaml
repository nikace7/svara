packages:
  - apps/*
  - packages/*

useNodeVersion: 22.23.2
nodeVersion: 22.23.2
engineStrict: true
saveExact: true
strictPeerDependencies: true
overrides:
  deepmerge-ts: 8.0.0
  mysql2: 3.23.1
  '@redocly/openapi-core>js-yaml': 4.3.2
  '@nestjs/platform-express>multer': 2.4.0
  '@nestjs/swagger>js-yaml': 5.4.3
  'concurrently>shell-quote': 1.12.0
  'express>proxy-addr': 2.0.8
  'ajv>fast-uri': 3.1.8
  source-map-js: 1.2.2
  'brace-expansion@1': 1.1.21
  'brace-expansion@2': 2.1.7
  'brace-expansion@5': 5.0.12
# braces has no patched release. It is reached only through @next/eslint-plugin-next
# globbing our own lint config, never untrusted input, and is not in the runtime image.
auditConfig:
  ignoreGhsas:
    - GHSA-vfj7-8cjw-p6xm
onlyBuiltDependencies:
  - '@nestjs/core'
  - '@prisma/engines'
  - '@tailwindcss/oxide'
  - esbuild
  - prisma
  - sharp
