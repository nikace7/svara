name: Verify Svara
on:
  push:
    branches: [main, 'codex/**', 'feat/**', 'fix/**', 'chore/**', 'docs/**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  foundation:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CI: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
      PROVIDER_MODE: fixture
      ALLOW_LIVE_EVAL: 'false'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 10.34.5
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level=moderate
      - run: pnpm setup:local
      - run: pnpm infra:up
      - run: pnpm db:generate && pnpm db:migrate && pnpm db:seed
      - run: pnpm check
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: pnpm test:integration
        env:
          MEDIA_INSPECTION_MODE: native
      - run: pnpm exec playwright install --with-deps chromium
      - name: Verify production containers and browser journeys
        run: |
          pnpm infra:down
          pnpm demo:up
          pnpm test:integration:container
          pnpm test:container
          pnpm test:media:sandbox
          pnpm test:e2e
      - name: Save browser failure evidence
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: browser-failure-evidence
          path: |
            playwright-report/
            test-results/
      - name: Stop local stack
        if: always()
        run: pnpm demo:down
