name: Verify Svara
on:
  push:
    branches: [main, 'codex/**', 'feat/**', 'fix/**', 'chore/**', 'docs/**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  foundation:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CI: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
      PROVIDER_MODE: fixture
      ALLOW_LIVE_EVAL: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.34.5
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level=moderate
      - run: pnpm setup:local
      - run: pnpm infra:up
      # The demo seed writes inspected media; run it with Compose's shared volume below.
      - run: pnpm db:generate && pnpm db:migrate
      - run: pnpm check
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: pnpm test:integration
        env:
          MEDIA_INSPECTION_MODE: native
      - run: pnpm exec playwright install --with-deps chromium
      - name: Verify production containers and browser journeys
        run: |
          pnpm infra:down
          pnpm demo:up
          pnpm test:integration:container
          pnpm test:container
          pnpm test:media:sandbox
          pnpm test:e2e
      - name: Save browser failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-failure-evidence
          path: |
            playwright-report/
            test-results/
      - name: Stop local stack
        if: always()
        run: pnpm demo:down
