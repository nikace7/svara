name: Verify Svara
on:
  push:
    branches: [main, 'feat/**', 'fix/**', 'chore/**', 'docs/**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  foundation:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CI: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
      PROVIDER_MODE: fixture
      ALLOW_LIVE_EVAL: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm setup:local
      - run: pnpm infra:up
      - run: pnpm db:generate && pnpm db:migrate && pnpm db:seed
      - run: pnpm check
      - run: pnpm test:integration
      - run: pnpm exec playwright install --with-deps chromium
      - name: Verify production containers and browser journeys
        run: |
          pnpm infra:down
          pnpm demo:up
          pnpm test:e2e
      - name: Save browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-failure-evidence
          path: |
            playwright-report/
            test-results/
      - name: Stop local stack
        if: always()
        run: pnpm demo:down
