name: Verify Svara
on:
  push:
    branches: [main, 'feat/**', 'fix/**', 'chore/**', 'docs/**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  foundation:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CI: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
      PROVIDER_MODE: fixture
      ALLOW_LIVE_EVAL: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 10.34.5
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level=moderate
      - run: pnpm setup:local
      - run: pnpm infra:up
      # The demo seed writes inspected media; run it with Compose's shared volume below.
      - run: pnpm db:generate && pnpm db:migrate
      - run: pnpm check
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: pnpm test:integration
        env:
          MEDIA_INSPECTION_MODE: native
      # The fixed bilingual evaluation in demo mode; --live needs a key and never runs here.
      - run: pnpm eval:conversations
      - name: Save evaluation results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: evaluation
          path: artifacts/evaluation/
          if-no-files-found: ignore
      - run: pnpm exec playwright install --with-deps chromium
      # Live-mode lab journeys run on their own stub-provider stack against the test database.
      - run: pnpm test:e2e:live
      - name: Verify production containers and browser journeys
        run: |
          pnpm infra:down
          pnpm demo:up
          pnpm test:integration:container
          pnpm test:container
          pnpm test:media:sandbox
          pnpm test:e2e
      - name: Save browser failure evidence
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-failure-evidence
          path: |
            playwright-report/
            test-results/
      - name: Stop local stack
        if: always()
        run: pnpm demo:down
